  .node .head { padding:7px 12px 5px; border-bottom:1px solid #eef0f4; font-size:13px; font-weight:700; line-height:1.35; }
  .node .file,.node .grp { color:var(--muted); font-size:10px; font-weight:400; line-height:1.45; }
  .node .step { position:relative; min-height:34px; padding:6px 28px 6px 10px; border-top:1px dashed #edf0f4; color:var(--text); font-size:11.5px; line-height:1.5; overflow-wrap:anywhere; }
  .port { position:absolute; width:13px; height:13px; border-radius:50%; transform:translate(-50%,-50%); cursor:crosshair; }
  .port.in { left:-2px; background:#fff; border:2px solid #ea4335; }
  .port.out { right:-11px; background:#fff; border:2px solid #34a853; }
  path.link { fill:none; stroke:#7a808c; stroke-width:1.6; }
  #lockBtn,#modeBtn { padding:6px 14px; border:1.5px solid var(--line); border-radius:8px; background:#fff; color:inherit; cursor:pointer; }
  #lockBtn.on { background:#4285f4; border-color:#4285f4; color:#fff; }
  .legend { margin-left:auto; display:flex; gap:12px; flex-wrap:wrap; }
  .legend span { display:inline-flex; align-items:center; gap:5px; }
  .sw { width:11px; height:11px; border-radius:3px; display:inline-block; }
  .essay { width:680px; cursor:default; }
  .essay .head { border-bottom:0; }
  .essay-body { max-height:650px; padding:8px 15px 15px; overflow:auto; color:var(--text); font-size:12.5px; line-height:1.7; }
  .essay-body p { margin:7px 0; }
  .essay-body .q { display:block; margin-top:12px; color:#313846; font-weight:700; }
  body.dark { background:#14171c; color:#d4dae3; }
  body.dark #toolbar { background:#1d222a; border-color:#2c333d; }
  body.dark svg.grid { background:radial-gradient(circle,#3a4250 1px,transparent 1px); }
  body.dark .node { background:#1f252e; border-color:#333c48; box-shadow:0 2px 10px rgba(0,0,0,.35); }
  body.dark .node .head { border-color:#2c333d; color:#e6ebf2; }
  body.dark .node .step, body.dark .essay-body { color:#d4dae3; border-color:#2a313b; }
  body.dark .node .file, body.dark .node .grp { color:#9aa5b5; }
  body.dark .port.in, body.dark .port.out { background:#1f252e; }
  body.dark path.link { stroke:#98a1b0; }
  body.dark #lockBtn, body.dark #modeBtn { background:#1f252e; border-color:#3a4452; color:#d4dae3; }

    <p><b>总述</b> 内容模块负责把一条短视频从“上传中”推进到“已发布”或“已驳回”，并让公开详情、个人作品和内部批量查询复用同一套可见性与缓存规则。</p>
    <span class="q">Q1 为什么大文件不经过业务服务？</span><p>视频平均 15MB，经过业务服务会占用连接、网关与进程内存。创建视频时由服务端签发对象存储直传凭证，客户端直接上传 SeaweedFS；业务服务只处理很小的元数据和确认请求。</p>
    <span class="q">Q2 为什么先复制再探测？</span><p>上传凭证在有效期内可以再次使用。如果先校后拷，客户端可能在校验后替换文件。服务端先把临时对象复制到客户端无权写入的正式键，再读取正式对象探测，消除了替换窗口。</p>
    <span class="q">Q3 如何避免并发确认重复发布？</span><p>确认写入带 id、author_id、status=0 条件。两个请求同时到达时，只有一行更新成功；另一个请求重查后看到已发布或已驳回，按当前详情幂等返回。</p>
    <span class="q">Q4 为什么列表先查 ID？</span><p>公开列表索引覆盖 author_id、status、published_at、id，先取一页 ID 的代价低；详情再统一走 Redis 批量缓存。展示字段变化不会扩大列表索引。</p>
    <span class="q">Q5 Redis 不可用了怎么办？</span><p>缓存被当作可丢失数据。详情 MGet 失败后直接回源 MySQL；限流器运行期失败时告警并放行，避免上传全部不可用。启动阶段仍会检查 Redis，配置或启动失败直接暴露。</p>
    <span class="q">Q6 图片和视频如何控制访问？</span><p>Bucket 保持私有，MySQL 只存对象键。接口先判断查看者能否看这条视频，再实时签发 1 小时地址；未发布内容对其他用户统一返回 404。</p>
    <span class="q">Q7 如何处理媒体不合规？</span><p>只读取前 512KB 交给 ffprobe，检查容器、编码、时长和分辨率。失败返回 422 并保留 status=0，客户端重传合格文件后可以再次确认。</p>
    <span class="q">Q8 为什么当前用假审核？</span><p>本期目标是先闭环发布、缓存和读取路径。Reviewer 是独立接口，默认实现直接通过，也可配置驳回；真实异步审核和回调属于后续扩展。</p>
   </div>`}
];

const cardMap=Object.fromEntries(cards.map(c=>[c.id,c]));
const inCount={};
cards.forEach(c=>c.steps.forEach(s=>{if(s.to)inCount[s.to]=(inCount[s.to]||0)+1;}));
const W=4600,H=2800,NW=270;
const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
svg.setAttribute("class","grid"); svg.setAttribute("width",W); svg.setAttribute("height",H);
const canvas=document.getElementById("canvas");
canvas.style.width=W+"px"; canvas.style.height=H+"px"; canvas.appendChild(svg);
const links=[],heads=[]; let locked=false;

cards.forEach(c=>{
  const el=document.createElement("div");
  el.className="node"+(c.type==="essay"?" essay":"");
  el.style.left=c.x+"px"; el.style.top=c.y+"px";
  const head=`<div class="head" style="background:${c.c}"><div class="file">${c.file}</div><div class="grp">${c.grp}</div>${c.name}</div>`;
  if(c.type==="essay"){
    el.innerHTML=head+c.body; canvas.appendChild(el); heads.push({el:el.querySelector(".head"),light:c.c});
  }else{
    el.innerHTML=head+c.steps.map(s=>`<div class="step">${s.label}</div>`).join("");
    canvas.appendChild(el); heads.push({el:el.querySelector(".head"),light:c.c});
    c.el=el; el.outs=[];
    el.querySelectorAll(".step").forEach(se=>{
      const p=document.createElement("div"); p.className="port out";
      const y=se.offsetTop+se.offsetHeight/2; p.style.top=y+"px"; el.appendChild(p); el.outs.push(y);
    });
    const count=Math.max(inCount[c.id]||0,1); el.ins=[];
    for(let i=0;i<count;i++){
      const p=document.createElement("div"); p.className="port in";
      const y=el.offsetHeight*(i+1)/(count+1); p.style.top=y+"px"; el.appendChild(p); el.ins.push(y);
    }
  }
  let drag=false,sx=0,sy=0,ox=0,oy=0;
  el.addEventListener("mousedown",e=>{
    if(locked||c.type==="essay"||e.target.classList.contains("port"))return;
    drag=true; sx=e.clientX; sy=e.clientY; ox=c.x; oy=c.y; e.preventDefault();
  });
  document.addEventListener("mousemove",e=>{
    if(!drag)return; c.x=ox+e.clientX-sx; c.y=oy+e.clientY-sy;
    el.style.left=c.x+"px"; el.style.top=c.y+"px"; drawLinks();
  });
  document.addEventListener("mouseup",()=>drag=false);
});

function outPos(id,i){const c=cardMap[id];return{x:c.x+NW,y:c.y+c.el.outs[i]};}
function inPos(id,i){const c=cardMap[id];return{x:c.x,y:c.y+c.el.ins[i]};}
function drawLinks(){
  links.forEach(l=>{
    const a=outPos(l.from.id,l.from.i),b=inPos(l.to.id,l.to.i);
    l.path.setAttribute("d",`M ${a.x} ${a.y} C ${a.x+95} ${a.y}, ${b.x-95} ${b.y}, ${b.x} ${b.y}`);
  });
}
const used={};
cards.forEach(c=>c.steps.forEach((s,i)=>{
  if(!s.to)return;
  const j=used[s.to]||0; used[s.to]=j+1;
  const path=document.createElementNS("http://www.w3.org/2000/svg","path");
  path.setAttribute("class","link"); svg.appendChild(path);
  links.push({path,from:{id:c.id,i},to:{id:s.to,i:j}});
}));
drawLinks();

const viewport=document.getElementById("viewport");
let pan=false,px=0,py=0,tx=0,ty=0,baseX=0,baseY=0;
viewport.addEventListener("mousedown",e=>{
  if(e.target.closest(".node"))return;
  pan=true; px=e.clientX; py=e.clientY; baseX=tx; baseY=ty;
  viewport.classList.add("panning"); e.preventDefault();
});
document.addEventListener("mousemove",e=>{
  if(!pan)return; tx=baseX+e.clientX-px; ty=baseY+e.clientY-py;
  canvas.style.transform=`translate(${tx}px,${ty}px)`;
});
document.addEventListener("mouseup",()=>{pan=false;viewport.classList.remove("panning");});

const lockBtn=document.getElementById("lockBtn");
lockBtn.addEventListener("click",()=>{
  locked=!locked; lockBtn.textContent=locked?"🔒 已锁定":"🔓 解锁";
  lockBtn.classList.toggle("on",locked);
  document.querySelectorAll(".node").forEach(n=>n.classList.toggle("locked",locked));
});

const modeBtn=document.getElementById("modeBtn");
function darken(hex){
  const n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  return `rgb(${Math.round(r*.22+18)},${Math.round(g*.22+20)},${Math.round(b*.22+28)})`;
}
function applyMode(dark){
  document.body.classList.toggle("dark",dark);
  modeBtn.textContent=dark?"☀️ 白天":"🌙 夜间";
  heads.forEach(h=>h.el.style.background=dark?darken(h.light):h.light);
}
modeBtn.addEventListener("click",()=>{
  const dark=!document.body.classList.contains("dark"); applyMode(dark);
  try{localStorage.setItem("contentCanvasDark",dark?"1":"0");}catch(e){}
});
try{if(localStorage.getItem("contentCanvasDark")==="1")applyMode(true);}catch(e){}
</script>
</body>
</html>
